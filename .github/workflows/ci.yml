name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel test suite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Runs on the project's PHP 7.4 baseline and the recommended 8.1 target.
        php: ['7.4', '8.1']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: aroma_testing
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, gd, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite uses RefreshDatabase against the aroma_testing database
      # configured in phpunit.xml, so migrations run automatically per run.
      - name: Run test suite
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test
